name: National offline data

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      dataset:
        description: "Build all datasets or rerun one dataset"
        type: choice
        options: [all, karte, routing, osm, suche, postleitzahlen, laderegister]
        default: all
      draft_release:
        description: "Save the verified datasets in unpublished test releases"
        type: boolean
        default: false
      publish_updates:
        description: "Activate verified app updates for the current 28-day slot"
        type: boolean
        default: false
      use_verified_drafts:
        description: "Seed the first app catalog with the verified Germany test drafts"
        type: boolean
        default: false

concurrency:
  group: feldflug-offline-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.window.outputs.slot }}
      due: ${{ steps.window.outputs.due }}
      production: ${{ steps.mode.outputs.production }}
      datasets: ${{ steps.mode.outputs.datasets }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B scripts/test-offline-update-publication.py
      - id: window
        run: python -B scripts/publish-offline-updates.py gate
      - id: mode
        env:
          DATASET: ${{ inputs.dataset || 'all' }}
          PRODUCTION: ${{ github.event_name == 'schedule' || inputs.publish_updates }}
          SEED: ${{ inputs.use_verified_drafts || false }}
          FIRST: ${{ steps.window.outputs.first }}
        shell: bash
        run: |
          echo "production=$PRODUCTION" >> "$GITHUB_OUTPUT"
          if [[ "$SEED" == true ]]; then
            test "$PRODUCTION" = true
            test "$FIRST" = true
          fi
          if [[ "$PRODUCTION" == true ]]; then
            test "$DATASET" = all
            echo 'datasets=["karte","routing","osm","suche","postleitzahlen"]' >> "$GITHUB_OUTPUT"
          elif [[ "$DATASET" == all ]]; then
            echo 'datasets=["karte","routing","osm","suche","postleitzahlen","laderegister"]' >> "$GITHUB_OUTPUT"
          else
            echo "datasets=[\"$DATASET\"]" >> "$GITHUB_OUTPUT"
          fi
  national:
    needs: gate
    if: needs.gate.outputs.production != 'true' || needs.gate.outputs.due == 'true'
    name: ${{ matrix.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.gate.outputs.datasets) }}
    env:
      DATASET: ${{ matrix.dataset }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        if: matrix.dataset == 'routing' && !inputs.use_verified_drafts
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the OSM reader
        if: (matrix.dataset == 'osm' || matrix.dataset == 'suche') && !inputs.use_verified_drafts
        run: python -m pip install 'osmium==4.3.2'
      - name: Set up the map tool
        if: matrix.dataset == 'karte' && !inputs.use_verified_drafts
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/pmtiles-bin"
          archive="$RUNNER_TEMP/pmtiles.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            'https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' '3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/pmtiles-bin" pmtiles
          echo "$RUNNER_TEMP/pmtiles-bin" >> "$GITHUB_PATH"
      - name: Build and validate the national dataset
        if: '!inputs.use_verified_drafts'
        env:
          PRODUCTION: ${{ needs.gate.outputs.production }}
        shell: bash
        run: |
          df -h "$RUNNER_TEMP"
          arguments=()
          if [[ "$PRODUCTION" == true && "$DATASET" == osm ]]; then
            arguments+=(--without-charging)
          fi
          python -B scripts/build-national-offline-data.py "$DATASET" "$RUNNER_TEMP/verified-data" "${arguments[@]}"
          df -h "$RUNNER_TEMP"
      - name: Reuse the verified initial packages
        if: inputs.use_verified_drafts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "$DATASET" in
            karte) tag=offline-de-test-43157577549-1-karte ;;
            routing) tag=offline-de-test-43157577549-1-routing ;;
            osm) tag=offline-de-test-43157577549-1-osm ;;
            suche) tag=offline-de-test-20261112-suche-lokal ;;
            postleitzahlen) tag=offline-de-test-43161689053-1-postleitzahlen ;;
          esac
          staging="$RUNNER_TEMP/seed"
          output="$RUNNER_TEMP/verified-data"
          mkdir "$staging" "$output"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$staging" \
            --pattern 'part-*.tar' --pattern 'pruefbericht.json' --pattern SHA256SUMS
          cd "$staging"
          tr -d '\r' < SHA256SUMS | sha256sum --check -
          for part in part-*.tar; do
            tar -xf "$part" -C "$output"
          done
          cp pruefbericht.json "$output/"
      - uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.dataset }}
          path: ${{ runner.temp }}/verified-data/pruefbericht.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified update bytes
        if: needs.gate.outputs.production == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ needs.gate.outputs.slot }}
        run: |
          python -B scripts/publish-offline-updates.py stage --slot "$SLOT" --dataset "$DATASET" \
            --data "$RUNNER_TEMP/verified-data" --output "$RUNNER_TEMP/update-group"
      - uses: actions/upload-artifact@v4
        if: needs.gate.outputs.production == 'true'
        with:
          name: update-group-${{ matrix.dataset }}
          path: ${{ runner.temp }}/update-group/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Store test packages in an unpublished draft
        if: inputs.draft_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          output="$RUNNER_TEMP/draft-assets"
          python -B scripts/pack-national-offline-draft.py "$RUNNER_TEMP/verified-data" "$output"
          tag="offline-de-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$DATASET"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease --latest=false --title "Feldflug offline data test ($DATASET)" \
            --notes "Verified test datasets from build commit $GITHUB_SHA. This draft does not update the production catalogue." \
            "$output"/*
          verify_upload() {
            local release_id digest name
            release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\" and .draft) | .id") || return 1
            [[ "$release_id" =~ ^[0-9]+$ ]] || return 1
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq '.[] | [.digest, .name, .state] | @tsv' > "$RUNNER_TEMP/assets.tsv" || return 1
            while read -r digest name; do
              grep -Fxq "$(printf 'sha256:%s\t%s\tuploaded' "$digest" "$name")" "$RUNNER_TEMP/assets.tsv" || return 1
            done < "$output/SHA256SUMS"
          }
          for attempt in 1 2 3 4 5 6; do
            if verify_upload; then
              echo "GitHub verified the digests for $tag."
              exit 0
            fi
            sleep 5
          done
          echo "Unable to verify all uploaded asset digests for $tag." >&2
          exit 1
  activate:
    needs: [gate, national]
    if: needs.gate.outputs.production == 'true' && needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: update-group-*
          path: update-groups
          merge-multiple: true
      - name: Activate the complete catalog
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ needs.gate.outputs.slot }}
        run: python -B scripts/publish-offline-updates.py activate --slot "$SLOT" --data update-groups
